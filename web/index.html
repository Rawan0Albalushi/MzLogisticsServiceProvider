<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MoveX service provider operations for transportation companies.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#00A6A6">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MoveX">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MoveX</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #003D3D;
    }

    #splash {
      position: fixed;
      inset: 0;
      background: #003D3D;
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="MoveX"></div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    function hideSplash() {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    }
    window.addEventListener('flutter-first-frame', hideSplash);
    document.addEventListener('flutter-first-frame', hideSplash);
  </script>
</body>
</html>
